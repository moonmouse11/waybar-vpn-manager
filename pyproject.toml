[project]
name = "waybar-vpn-manager"
version = "0.3.0"
description = "Waybar + Walker VPN manager for Omarchy 3: WireGuard, AmneziaWG, OpenVPN, NetworkManager, VLESS / Shadowsocks keys and Happ"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/moonmouse11/waybar-vpn-manager"
Changelog = "https://github.com/moonmouse11/waybar-vpn-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM",  # pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
  "RUF",   # ruff's own
  "PL",    # pylint
  "S",     # bandit (security)
  "BLE",   # blind except
  "PTH",   # pathlib over os.path
  "RET", "PIE", "PERF",
  "ERA",   # commented-out code
]
ignore = [
  "S603", "S607",  # subprocess by design: wg-quick, nmcli, happd, sudo… — always argv lists, never a shell
  "PLR2004",       # magic values: ports, timeouts, exit codes read better inline
  "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity counters
]

# menu glyphs and Cyrillic hotkeys (о/л/ы/й are j/k/s/q on a Russian layout) are on purpose
allowed-confusables = ["‹", "ℹ", "×", "а", "б", "в", "В", "д", "о", "л", "ы", "Ы", "й", "Й", "е", "с", "р"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]  # asserts, fixture-heavy signatures, imports inside tests

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]


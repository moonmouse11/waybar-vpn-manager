# SonarQube / SonarCloud project configuration.
# Secrets (SONAR_TOKEN, SONAR_HOST_URL) live in the GitHub repository settings.

sonar.projectKey=moonmouse11_waybar-vpn-manager
sonar.organization=moonmouse11

sonar.sources=src

# coverage.xml produced by pytest-cov in CI (paths normalized to be
# repo-root-relative before the scan — see .github/workflows/sonar.yml).
sonar.python.coverage.reportPaths=coverage.xml

# Fail the build when the Quality Gate fails.
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8

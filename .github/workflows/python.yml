name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:

    # Pinned, not "ubuntu-latest": GitHub is migrating that label from
    # 24.04 to 26.04 starting 2026-10-19, and the matrix already covers
    # the Python version spread — no need to also float the OS under it.
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check src tests

    - name: Run test suite
      run: pytest
